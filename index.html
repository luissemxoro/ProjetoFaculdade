<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - To Do Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="icon" type="image/x-icon" href="imagens/favicon.png">

</head>
<body>
    <div class="bg-elements">
        <div class="floating" style="top: 10%; left: 10%;">📓</div>
        <div class="floating" style="top: 60%; left: 80%;">🖊️</div>
        <div class="cursive-bg" style="top: 30%;">Organização e Foco...</div>
    </div>

    <div class="login-card">
        <h2>Acessar Conta</h2>
        <div id="error-msg" class="error-message"></div>
        
        <form id="loginForm">
            <input type="email" id="email" placeholder="Seu e-mail" required>
            <input type="password" id="password" placeholder="Sua senha" required>
            <button type="submit" class="btn-main">ENTRAR</button>
        </form>
        
        <div class="links-row">
            <a href="cadastro.html">Criar nova conta</a>
            <a id="btn-recuperar">Esqueceu a senha?</a>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
