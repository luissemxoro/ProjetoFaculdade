<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Acesso - Minhas Tarefas</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { height: 100vh; display: flex; justify-content: center; align-items: center; background: #0f172a; overflow: hidden; position: relative; }
        
        .bg-elements { position: absolute; width: 100%; height: 100%; z-index: -1; perspective: 1000px; }
        .floating { position: absolute; font-size: 60px; opacity: 0.2; animation: float 12s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-100px) rotate(20deg); } }
        .cursive-bg { position: absolute; font-family: 'Dancing Script', cursive; color: rgba(255,255,255,0.03); font-size: 80px; white-space: nowrap; animation: write 25s linear infinite; }
        @keyframes write { from { left: -100%; } to { left: 100%; } }

        .login-card {
            background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); padding: 40px; border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1); width: 400px; color: white; box-shadow: 0 25px 50px rgba(0,0,0,0.5); text-align: center;
        }
        h2 { margin-bottom: 25px; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: none; background: #e2e8f0; font-size: 16px; }
        .btn-main { width: 100%; padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .links-row { display: flex; justify-content: space-between; margin-top: 20px; font-size: 13px; }
        .links-row a { color: #94a3b8; text-decoration: none; cursor: pointer; }
        .links-row a:hover { color: white; }
    </style>
</head>
<body>
    <div class="bg-elements">
        <div class="floating" style="top: 10%; left: 10%;">📓</div>
        <div class="floating" style="top: 60%; left: 80%;">🖊️</div>
        <div class="cursive-bg" style="top: 30%;">Organização e Foco...</div>
    </div>

    <div class="login-card" id="auth-container">
        <h2 id="auth-title">Acessar Conta</h2>
        <input type="email" id="email" placeholder="Seu e-mail">
        <input type="password" id="password" placeholder="Sua senha">
        <button class="btn-main" id="btn-action" onclick="handleAuth()">ENTRAR NO DASHBOARD</button>
        
        <div class="links-row">
            <a onclick="toggleAuthMode()" id="toggle-link">Criar nova conta</a>
            <a onclick="recuperarSenha()">Esqueceu a senha?</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        
        const firebaseConfig = { apiKey: "AIzaSyCrc9WgN_9GD7baU4Ih-FokBvEJaqKBdqI", authDomain: "meusistemadelogin.firebaseapp.com", projectId: "meusistemadelogin" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let isLogin = true;

        window.toggleAuthMode = () => {
            isLogin = !isLogin;
            document.getElementById('auth-title').innerText = isLogin ? "Acessar Conta" : "Criar Conta";
            document.getElementById('btn-action').innerText = isLogin ? "ENTRAR NO DASHBOARD" : "CADASTRAR E ENTRAR";
            document.getElementById('toggle-link').innerText = isLogin ? "Criar nova conta" : "Já tenho conta";
        };

        window.handleAuth = () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const action = isLogin ? signInWithEmailAndPassword : createUserWithEmailAndPassword;
            
            action(auth, email, pass)
                .then(() => window.location.href = 'home.html')
                .catch(err => alert("Erro na autenticação: " + err.message));
        };

        window.recuperarSenha = () => {
            const email = document.getElementById('email').value;
            if (!email) return alert("Digite seu e-mail primeiro.");
            sendPasswordResetEmail(auth, email).then(() => alert("E-mail de recuperação enviado!"));
        };
    </script>
</body>
</html>
