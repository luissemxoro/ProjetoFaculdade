<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Firebase</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .register-container { background-color: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; }
        .register-container h2 { text-align: center; margin-bottom: 24px; color: #333333; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #666666; font-size: 14px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #cccccc; border-radius: 4px; font-size: 16px; }
        .input-group input:focus { border-color: #28a745; outline: none; }
        .error-message { color: #dc3545; font-size: 14px; margin-bottom: 15px; display: none; text-align: center; }
        .btn-register { width: 100%; padding: 12px; background-color: #28a745; border: none; border-radius: 4px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-register:hover { background-color: #218838; }
        .utilities { text-align: center; margin-top: 16px; font-size: 14px; }
        .utilities a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>Criar Conta</h2>
        <div id="error-msg" class="error-message"></div>
        
        <form id="registerForm">
            <div class="input-group">
                <label for="newEmail">E-mail</label>
                <input type="email" id="newEmail" placeholder="Digite um e-mail válido" required>
            </div>

            <div class="input-group">
                <label for="newPassword">Escolha uma Senha (mínimo 6 dígitos)</label>
                <input type="password" id="newPassword" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn-register">Cadastrar</button>

            <div class="utilities">
                <a href="index.html">Já tem uma conta? Voltar para o Login</a>
            </div>
        </form>
    </div>

    <!-- Importando módulos do Firebase v10+ via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // COLE AS SUAS CREDENCIAIS DO PASSO 3 AQUI ABAIXO:
       const firebaseConfig = {
            apiKey: "AIzaSyCrc9WgN_9GD7baU4Ih-FokBvEJaqKBdqI",
            authDomain: "meusistemadelogin.firebaseapp.com",
            projectId: "meusistemadelogin",
            storageBucket: "meusistemadelogin.firebasestorage.app",
            messagingSenderId: "245655955087",
            appId: "1:245655955087:web:f667da7b75e3cac04d72fa",
            measurementId: "G-KBW5RD6YD8"
            };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Lógica de Cadastro
        document.getElementById('registerForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const email = document.getElementById('newEmail').value;
            const senha = document.getElementById('newPassword').value;
            const mensagemErro = document.getElementById('error-msg');

            // Função oficial do Firebase para criar um usuário real na nuvem
            createUserWithEmailAndPassword(auth, email, senha)
                .then((userCredential) => {
                    alert('Conta salva com sucesso na nuvem do Firebase!');
                    window.location.href = 'index.html';
                })
                .catch((error) => {
                    mensagemErro.innerText = "Erro ao cadastrar: " + error.message;
                    mensagemErro.style.display = 'block';
                });
        });
    </script>
</body>
</html>
