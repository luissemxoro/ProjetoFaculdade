<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Minhas Tarefas</title>
    <link rel="stylesheet" href="css/home.css">
</head>
<body>

    <header>
        <div class="user-chip" id="user-greeting">Olá, Carregando...</div>
        <div>
            <button id="btn-config" style="background:none; border:none; color:white; cursor:pointer; margin-right: 15px;">⚙️ Opções</button>
            <button id="btn-logout" style="background:none; border:none; color:#ef4444; cursor:pointer; font-weight:bold;">Sair</button>
        </div>
    </header>

    <h2>📅 Tarefas de Hoje</h2>
    <div id="today-list" class="today-section"></div>

    <div class="filters">
        <button class="f-btn active" id="btn-filtro-pendentes">Não Concluídas</button>
        <button class="f-btn" id="btn-filtro-concluidas">Concluídas</button>
        <button class="f-btn" id="btn-filtro-futuras">Futuras</button>
    </div>

    <div id="task-list" class="grid"></div>

    <button class="fab" id="btn-abrir-modal">+</button>

    <div id="modalTask" class="modal">
        <div class="m-content">
            <h3 id="modal-title">Nova Tarefa</h3>
            <input type="text" id="t-titulo" placeholder="Título">
            <textarea id="t-desc" placeholder="Descrição"></textarea>
            <input type="date" id="t-prazo">
            <button class="btn-action" style="background:#1e3a8a; width:100%; padding:15px;" id="btn-salvar-tarefa">SALVAR TAREFA</button>
            <button id="btn-fechar-modal" style="width:100%; margin-top:10px; border:none; background:none; cursor:pointer">Cancelar</button>
        </div>
    </div>

    <script type="module" src="js/home.js"></script>
</body>
</html>
