<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Minhas Tarefas</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="bg-elements">
        <div class="floating" style="top: 15%; left: 80%;">✨</div>
        <div class="floating" style="top: 70%; left: 15%;">📝</div>
    </div>

    <div class="login-card">
        <h2>Criar Conta</h2>
        <div id="error-msg" class="error-message"></div>
        
        <form id="registerForm">
            <input type="email" id="newEmail" placeholder="Digite um e-mail válido" required>
            <input type="password" id="newPassword" placeholder="Escolha uma senha (mín. 6 dígitos)" required>
            <button type="submit" class="btn-main">CADASTRAR E ENTRAR</button>
        </form>

        <div class="links-row" style="justify-content: center;">
            <a href="index.html">Já tem uma conta? Voltar para o Login</a>
        </div>
    </div>

    <script type="module">
        import { auth } from "./js/firebase-config.js";
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        document.getElementById('registerForm').addEventListener('submit', (event) => {
            event.preventDefault();
            const email = document.getElementById('newEmail').value;
            const senha = document.getElementById('newPassword').value;
            const mensagemErro = document.getElementById('error-msg');

            createUserWithEmailAndPassword(auth, email, senha)
                .then(() => {
                    alert('Conta salva com sucesso na nuvem!');
                    window.location.href = 'home.html';
                })
                .catch((error) => {
                    mensagemErro.innerText = "Erro ao cadastrar: " + error.message;
                    mensagemErro.style.display = 'block';
                });
        });
    </script>
</body>
</html>
